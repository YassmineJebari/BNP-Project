<h2>Détails de la recette</h2>

<div>
  <strong>Titre :</strong> {{ recette.titre }}
</div>

<div>
  <strong>Description :</strong> {{ recette.description }}
</div>

<div>
  <strong>Ingrédients :</strong>
  <ul>
    <li *ngFor="let ing of recette.ingredients">{{ ing }}</li>
  </ul>
</div>

<button [routerLink]="['/recipes']">Retour à la liste</button>
